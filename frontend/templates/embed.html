<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMAPCLASS - Live Portal View</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='img/css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/css/logo.png') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            display: flex;
            flex-direction: column;
        }
        .embed-bar {
            background: #000000;
            color: #ffffff;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
            z-index: 100;
        }
        .embed-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="embed-bar">
        <div style="display: flex; align-items: center; gap: 14px;">
            <a href="/" style="text-decoration: none; color: #ffffff; display: flex; align-items: center; gap: 10px;">
                <img src="{{ url_for('static', filename='img/css/logo.png') }}" height="30" alt="Logo" onerror="this.style.display='none'">
                <span style="font-family: 'Climate Crisis', sans-serif; font-size: 1.2rem;">SMAPCLASS</span>
            </a>
            <span class="status-pill" style="padding: 4px 12px; font-size: 0.75rem;">
                <span class="status-dot online"></span> Live Streamlit Backend
            </span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="/" class="btn-pill" style="padding: 8px 20px; font-size: 0.85rem;">← Back to Landing Page</a>
            <a href="{{ streamlit_url }}" target="_blank" class="btn-pill" style="padding: 8px 20px; font-size: 0.85rem; background: #5865F2; color: #fff;">Open Standalone ↗</a>
        </div>
    </div>
    <div class="embed-container">
        <iframe src="{{ streamlit_url }}" allow="camera; microphone" allowfullscreen></iframe>
    </div>
</body>
</html>
